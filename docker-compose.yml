version: '3.8'

services:
  postgres_local:
    image: pgvector/pgvector:pg16
    container_name: cancotn_postgres_local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cancotn_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── n8n: Crawler automation (Phase 06b) ───────────────────────
  # Access UI: http://localhost:5678
  # Docs: https://docs.n8n.io/hosting/installation/docker/
  n8n:
    image: n8nio/n8n:latest
    container_name: cancotn_n8n
    ports:
      - "5678:5678"
    environment:
      # Basic Auth bảo vệ UI n8n
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme_n8n}
      # URL n8n dùng khi tạo webhook (gọi về Next.js app)
      # Trên local: http://host.docker.internal:3000
      # Trên production: thay bằng domain thật
      - WEBHOOK_URL=${N8N_WEBHOOK_CALLBACK_URL:-http://host.docker.internal:3000}
      # Timezone
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    # Đảm bảo n8n có thể kết nối PostgreSQL nếu cần
    depends_on:
      - postgres_local
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_local_data:
    name: cancotn_postgres_local_data
  n8n_data:
    name: cancotn_n8n_data
