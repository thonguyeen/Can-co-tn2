# ════════════════════════════════════════════════════
# Cần & Có — Nginx Reverse Proxy Config
#
# Đặt file này vào nginx config folder trên VPS
# (thư mục config phụ thuộc vào cách setup nginx_proxy container)
#
# Ví dụ: /opt/nginx/conf.d/cancotn.conf
#         hoặc mount volume: ./nginx/cancotn.conf:/etc/nginx/conf.d/cancotn.conf
#
# Sau khi copy, reload nginx:
#   docker exec nginx_proxy nginx -t
#   docker exec nginx_proxy nginx -s reload
# ════════════════════════════════════════════════════

# Upstream pool — can-co_app kết nối qua shared Docker network
upstream cancotn_backend {
    server can-co_app:4000;
    # keepalive: giữ connection pool với backend
    keepalive 32;
}

server {
    listen 80;
    # Thay bằng domain thật của anh
    server_name cancotn.com www.cancotn.com;

    # Upload limit (ảnh BDS max ~5 ảnh x 2MB = 10MB)
    client_max_body_size 15M;

    # Timeout thoải mái cho AI chatbot (có thể slow)
    proxy_connect_timeout   60s;
    proxy_send_timeout     120s;
    proxy_read_timeout     120s;

    # ── Main app ─────────────────────────────────────
    location / {
        proxy_pass http://cancotn_backend;
        proxy_http_version 1.1;

        # WebSocket support (nếu có real-time features sau này)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Forward real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js static files (cache dài hạn) ─────────
    location /_next/static/ {
        proxy_pass http://cancotn_backend;
        # Next.js static files có hash trong tên → cache vĩnh viễn
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_set_header Host $host;
    }

    # ── Public folder (icons, images, etc.) ──────────
    location /images/ {
        proxy_pass http://cancotn_backend;
        expires 30d;
        add_header Cache-Control "public";
        proxy_set_header Host $host;
    }

    # ── Health check endpoint ─────────────────────────
    location /api/intents {
        proxy_pass http://cancotn_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
